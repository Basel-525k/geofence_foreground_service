name: geofence_foreground_service
description: A Flutter project that creates a foreground service to handle geofencing.
version: 1.2.0
repository: https://github.com/vadrian89/geofence_foreground_service
license: Apache-2.0
homepage: https://github.com/vadrian89/geofence_foreground_service

environment:
  sdk: ^3.12.0
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter

  plugin_platform_interface: ^2.1.8
  latlng: ^2.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.f2fk.geofence_foreground_service
        pluginClass: GeofenceForegroundServicePlugin
      ios:
        pluginClass: GeofenceForegroundServicePlugin